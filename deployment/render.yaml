services:
  - type: web
    name: cloud-legal-stenographer-api
    runtime: python
    plan: free
    rootDir: cloud-legal-stenographer/backend
    buildCommand: pip install -r requirements.lock
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.6
